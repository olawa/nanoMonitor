[package]
name = "nanoparse"
version = "0.1.0"
edition = "2021"
authors = ["nanoStream Team"]
description = "Fast primer matching and BAM statistics for nanopore amplicon sequencing"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
env_logger = "0.11"
nanoparse-core = { path = "../nanoparse-core" }

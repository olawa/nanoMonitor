[package]
name = "nanoparse-core"
version = "0.1.0"
edition = "2021"
authors = ["nanoStream Team"]
description = "Core analysis library for nanopore amplicon sequencing"

[dependencies]
clap = { version = "4", features = ["derive"] }
rust-htslib = "0.47"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
triple_accel = "0.4"
anyhow = "1"
log = "0.4"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
nanoseq-core = { path = "../nanoseq-core" }

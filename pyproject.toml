[project]
name = "nanomonitor"
version = "0.1.0"
description = "Real-time Oxford Nanopore sequencing monitor and targeted amplicon analysis GUI"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "PyQt6>=6.7",
    "PyQt6-WebEngine>=6.7",
    "pysam>=0.22",
    "numpy>=1.26",
    "scipy>=1.11",
    "plotly>=5.18",
    "matplotlib>=3.8",
    "pyzmq>=25",
    "intervaltree>=3.1",
    "edlib>=1.3.9",
    "pandas>=2.1",
]

[dependency-groups]
dev = [
    "maturin>=1.7",
]

[tool.uv]
package = false

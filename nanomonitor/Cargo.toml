[package]
name = "nanomonitor"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_plot = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rfd = "0.15"
anyhow = "1"
nanoparse-core = { path = "../nanoparse-core" }
nanofilter-core = { path = "../nanofilter-core" }
nanoseq-core = { path = "../nanoseq-core" }
